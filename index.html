<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strolo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    background: #111;
    color: #fff;
  }

  #top-bar {
    padding: 10px;
    background: #1e1e1e;
    border-bottom: 1px solid #333;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  input[type=text] {
    flex: 1;
    min-width: 140px;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #2a2a2a;
    color: #fff;
    font-size: 14px;
    outline: none;
  }
  input[type=text]:focus { border-color: #4285f4; }

  button.primary {
    padding: 9px 18px;
    background: #4285f4;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    transition: background 0.15s;
  }
  button.primary:hover { background: #3367d6; }

  details { font-size: 13px; }
  summary { color: #888; cursor: pointer; user-select: none; }
  summary:hover { color: #aaa; }

  .key-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .key-row label { color: #888; font-size: 12px; min-width: 90px; }
  .key-row input { font-size: 12px; padding: 6px 10px; flex: 1; min-width: 200px; }
  .key-link { font-size: 11px; color: #4285f4; text-decoration: none; white-space: nowrap; }
  .key-link:hover { text-decoration: underline; }

  #image-area {
    flex: 1;
    position: relative;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #street-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
    transition: opacity 0.25s ease;
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: #888;
    font-size: 15px;
    text-align: center;
    padding: 20px;
    pointer-events: none;
  }
  #overlay-icon { font-size: 40px; }

  #bottom-bar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 14px;
    background: #1e1e1e;
    border-top: 1px solid #333;
    flex-wrap: wrap;
  }

  #play-btn {
    padding: 10px 22px;
    background: #34a853;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 700;
    min-width: 115px;
    transition: background 0.15s;
  }
  #play-btn:hover:not(:disabled) { background: #2d9249; }
  #play-btn:disabled { background: #444; color: #777; cursor: default; }

  .ctrl { display: flex; align-items: center; gap: 8px; }
  .ctrl label { font-size: 13px; color: #aaa; white-space: nowrap; }
  input[type=range] { width: 100px; accent-color: #4285f4; cursor: pointer; }

  #status { flex: 1; font-size: 13px; color: #f8a; text-align: center; min-width: 120px; }
  #progress { font-size: 13px; color: #888; white-space: nowrap; }
</style>
</head>
<body>

<div id="top-bar">
  <div class="row">
    <span style="font-size:18px;font-weight:800;letter-spacing:-0.5px;color:#fff;padding-right:4px;">Strolo</span>
    <input id="origin"      type="text" placeholder="📍 Starting point" />
    <input id="destination" type="text" placeholder="🏁 Destination" />
    <button class="primary" onclick="getRoute()">Get Route</button>
  </div>
  <details>
    <summary>API Keys — free, required (click to expand)</summary>
    <div class="key-row">
      <label>ORS Key</label>
      <input id="ors-key" type="text" placeholder="OpenRouteService API key" />
      <a class="key-link" href="https://openrouteservice.org/dev/#/signup" target="_blank">Get free key</a>
    </div>
    <div class="key-row">
      <label>Mapillary Token</label>
      <input id="map-key" type="text" placeholder="Mapillary access token" />
      <a class="key-link" href="https://www.mapillary.com/developer/api-documentation" target="_blank">Get free token</a>
    </div>
  </details>
</div>

<div id="image-area">
  <img id="street-img" alt="Street view" />
  <div id="overlay">
    <div id="overlay-icon">🚶</div>
    <div id="overlay-msg">Welcome to Strolo. Enter a start and destination above, add your free API keys, then click Get Route.</div>
  </div>
</div>

<div id="bottom-bar">
  <button id="play-btn" disabled onclick="togglePlay()">&#9654; Start</button>
  <div class="ctrl">
    <label for="speed">Speed</label>
    <input id="speed" type="range" min="1" max="10" value="4" />
  </div>
  <span id="status"></span>
  <span id="progress"></span>
</div>

<script>
let imageSequence = [];
let currentIndex  = 0;
let playing       = false;
let timer         = null;

function dist(a, b) {
  const R = 6371000;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const s = Math.sin(dLat/2)**2 +
    Math.cos(a.lat * Math.PI/180) * Math.cos(b.lat * Math.PI/180) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}

async function geocode(address, key) {
  const url = `https://api.openrouteservice.org/geocode/search?api_key=${key}&text=${encodeURIComponent(address)}&size=1`;
  const res  = await fetch(url);
  if (!res.ok) throw new Error(`Geocoding failed (${res.status}) — check your ORS key.`);
  const data = await res.json();
  if (!data.features?.length) throw new Error(`Address not found: "${address}"`);
  return data.features[0].geometry.coordinates; // [lng, lat]
}

async function getRoute() {
  const origin = document.getElementById('origin').value.trim();
  const dest   = document.getElementById('destination').value.trim();
  const orsKey = document.getElementById('ors-key').value.trim();
  const mapKey = document.getElementById('map-key').value.trim();

  if (!origin || !dest) return setStatus('Enter a start and destination.');
  if (!orsKey)          return setStatus('Enter your OpenRouteService API key.');
  if (!mapKey)          return setStatus('Enter your Mapillary access token.');

  reset();
  setOverlay('🗺️', 'Getting route…');

  try {
    const [startCoord, endCoord] = await Promise.all([
      geocode(origin, orsKey),
      geocode(dest,   orsKey),
    ]);

    const routeRes = await fetch(
      'https://api.openrouteservice.org/v2/directions/foot-walking/geojson', {
        method: 'POST',
        headers: { 'Authorization': orsKey, 'Content-Type': 'application/json' },
        body: JSON.stringify({ coordinates: [startCoord, endCoord] }),
      }
    );
    if (!routeRes.ok) {
      const err = await routeRes.json().catch(() => ({}));
      throw new Error(err.error?.message || `Route request failed (${routeRes.status})`);
    }
    const routeData = await routeRes.json();
    const rawCoords = routeData.features[0].geometry.coordinates;
    const coords    = rawCoords.map(c => ({ lat: c[1], lng: c[0] }));
    const km        = (routeData.features[0].properties.summary.distance / 1000).toFixed(1);

    setOverlay('📸', `Route found (${km} km). Loading street images…`);
    await loadMapillaryImages(coords, mapKey);

  } catch (err) {
    setOverlay('⚠️', err.message);
    setStatus('');
    console.error(err);
  }
}

async function loadMapillaryImages(coords, token) {
  const lats = coords.map(c => c.lat);
  const lngs = coords.map(c => c.lng);
  const pad  = 0.001;
  const bbox = [
    (Math.min(...lngs) - pad).toFixed(6),
    (Math.min(...lats) - pad).toFixed(6),
    (Math.max(...lngs) + pad).toFixed(6),
    (Math.max(...lats) + pad).toFixed(6),
  ].join(',');

  const url = `https://graph.mapillary.com/images`
    + `?access_token=${token}`
    + `&fields=id,thumb_1024_url,geometry`
    + `&bbox=${bbox}`
    + `&limit=2000`;

  const res = await fetch(url);
  if (!res.ok) {
    const body = await res.text().catch(() => '');
    throw new Error(`Mapillary error (${res.status}) — check your access token.`);
  }
  const data   = await res.json();
  const images = (data.data || []).map(img => ({
    id:  img.id,
    url: img.thumb_1024_url,
    lat: img.geometry.coordinates[1],
    lng: img.geometry.coordinates[0],
  }));

  if (!images.length) {
    throw new Error('No street imagery found here. Mapillary coverage may be limited — try a busier street or city centre.');
  }

  // Sample route every ~15 m, match each sample to nearest image within 25 m
  const sampled = sampleRoute(coords, 15);
  const matched = [];

  for (const pt of sampled) {
    let best = null, bestDist = Infinity;
    for (const img of images) {
      const d = dist(pt, img);
      if (d < bestDist) { bestDist = d; best = img; }
    }
    if (best && bestDist < 25) matched.push(best);
  }

  // Remove consecutive duplicates
  const deduped = matched.filter((img, i) => i === 0 || img.id !== matched[i-1].id);

  if (!deduped.length) {
    throw new Error('Images found nearby but could not be matched to the route. Try a different street.');
  }

  imageSequence = deduped;
  currentIndex  = 0;

  showImage(0);
  hideOverlay();
  document.getElementById('play-btn').disabled = false;
  document.getElementById('play-btn').textContent = '▶ Start';
  setStatus(`${imageSequence.length} images loaded.`);
  updateProgress();
}

function sampleRoute(coords, stepM) {
  const out = [coords[0]];
  let acc = 0;
  for (let i = 1; i < coords.length; i++) {
    acc += dist(coords[i-1], coords[i]);
    if (acc >= stepM) { out.push(coords[i]); acc = 0; }
  }
  out.push(coords[coords.length - 1]);
  return out;
}

function showImage(index) {
  if (index >= imageSequence.length) return;
  const img = document.getElementById('street-img');
  img.style.opacity = '0';
  img.style.display = 'block';
  img.src = imageSequence[index].url;
  img.onload  = () => { img.style.opacity = '1'; };
  img.onerror = () => { img.style.opacity = '0.2'; };

  // Preload next two
  for (let i = 1; i <= 2; i++) {
    if (index + i < imageSequence.length) {
      const pre = new Image();
      pre.src = imageSequence[index + i].url;
    }
  }
  updateProgress();
}

function togglePlay() { playing ? pause() : play(); }

function play() {
  if (currentIndex >= imageSequence.length - 1) currentIndex = 0;
  playing = true;
  document.getElementById('play-btn').textContent = '⏸ Pause';
  tick();
}

function pause() {
  playing = false;
  clearTimeout(timer);
  document.getElementById('play-btn').textContent = '▶ Resume';
}

function tick() {
  if (!playing) return;
  currentIndex++;
  if (currentIndex >= imageSequence.length) {
    pause();
    document.getElementById('play-btn').textContent = '▶ Restart';
    setStatus('Route complete!');
    return;
  }
  showImage(currentIndex);
  const speed = parseInt(document.getElementById('speed').value);
  const delay = Math.round(1400 - (speed - 1) * 148);
  timer = setTimeout(tick, delay);
}

function reset() {
  pause();
  imageSequence = [];
  currentIndex  = 0;
  document.getElementById('play-btn').disabled = true;
  document.getElementById('play-btn').textContent = '▶ Start';
  document.getElementById('street-img').style.display = 'none';
  document.getElementById('progress').textContent = '';
  setStatus('');
}

function setOverlay(icon, msg) {
  document.getElementById('overlay-icon').textContent = icon;
  document.getElementById('overlay-msg').textContent  = msg;
  document.getElementById('overlay').style.display    = 'flex';
}

function hideOverlay() {
  document.getElementById('overlay').style.display = 'none';
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }

function updateProgress() {
  if (!imageSequence.length) return;
  const pct = Math.round((currentIndex / (imageSequence.length - 1)) * 100);
  document.getElementById('progress').textContent = `${pct}%`;
}
</script>
</body>
</html>
